<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the felt extend under the notch; the UI uses
         safe-area-inset padding so controls stay clear of it (Step 5). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b6b3a" />
    <meta
      name="description"
      content="Offline blackjack trainer — practice optimal play."
    />
    <!-- iOS home-screen launch: run full-screen and let the felt extend under
         the status bar / notch (the topbar pads by safe-area-inset-top). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blackjack" />
    <title>Blackjack Trainer</title>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- The web manifest link and service-worker registration are injected at
         build time by vite-plugin-pwa (see vite.config.js). -->
  </head>
  <body>
    <!-- #app is rebuilt on every action, so it is NOT a live region (screen
         readers would re-read the whole table). Round results are announced
         through the separate, persistent #sr-status region instead. -->
    <div id="app"></div>
    <div id="sr-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
